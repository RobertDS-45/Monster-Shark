<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Shark Catch Fish</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #8fd2ff 0%, #1c4f7d 55%, #071b31 100%);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #0f3057;
        }
        
        .game-container {
            position: relative;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 22px 60px rgba(5, 24, 58, 0.28);
            width: min(100vw - 24px, 780px);
            max-width: 780px;
        }
        
        canvas {
            border: 3px solid #333;
            border-radius: 10px;
            background: linear-gradient(to bottom, #87CEEB, #98FB98);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 3 / 2;
            display: block;
            margin: 0 auto;
        }
        
        @media (max-width: 768px) {
            /* Compact the main card and reduce spacing so everything fits vertically */
            .game-container {
                padding: 10px;
                width: calc(100vw - 12px);
            }

            h1 {
                font-size: 18px;
                margin: 6px 0 8px 0;
            }

            /* Canvas should prefer height but be capped so controls remain visible */
            canvas {
                max-height: 42vh;
                height: auto;
            }

            /* Score boxes — compact and stacked */
            .game-info {
                flex-direction: column;
                gap: 6px;
                font-size: 15px;
                padding: 8px;
            }

            .score, .missed {
                padding: 8px 10px;
                font-size: 15px;
            }

            /* Utility buttons: attempt a single row, fall back to 2x2 grid on very narrow screens */
            .music-controls {
                display: flex;
                justify-content: center;
                gap: 8px;
                flex-wrap: nowrap;
                order: 1;
                margin-top: 6px;
            }

            .music-btn {
                min-width: 0;
                padding: 8px 10px;
                font-size: 13px;
                border-radius: 12px;
            }

            /* For very narrow devices, use a compact 2-column grid */
            @media (max-width: 420px) {
                .music-controls {
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 6px;
                }
            }

            /* D-pad should sit directly under the utility buttons and be slightly smaller */
            .mobile-controls {
                order: 2;
                margin-top: 8px;
                align-self: center;
            }

            .dpad-grid {
                grid-template-columns: repeat(3, 56px);
                grid-template-rows: repeat(3, 56px);
                gap: 6px;
            }

            .control-btn {
                width: 56px;
                height: 56px;
                font-size: 20px;
                border-radius: 12px;
            }
        }
        
        .game-info {
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-size: 18px;
            font-weight: 700;
            padding: 14px 18px;
            border-radius: 22px;
            background: rgba(7, 41, 81, 0.07);
            backdrop-filter: blur(6px);
        }
        
        .score,
        .missed {
            flex: 1;
            padding: 12px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(6, 47, 89, 0.08);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
        }
        
        .score {
            color: #1a4a72;
        }
        
        .missed {
            color: #004868;
        }
        
        .game-over {
            position: absolute;
            inset: 20px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5;
            background: rgba(0, 23, 55, 0.72);
            color: #f8f2e9;
            padding: 30px 24px;
            border-radius: 28px;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            box-shadow: 0 24px 48px rgba(3, 20, 50, 0.38);
        }

        #musicControls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        .music-btn {
            min-width: 120px;
            padding: 14px 18px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #006db3, #1cb5f3);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 14px 30px rgba(1, 31, 69, 0.22);
        }

        .music-btn:hover {
            background: linear-gradient(135deg, #005b9a, #1690cb);
            transform: translateY(-1px);
        }

        .music-btn:active {
            transform: scale(0.96);
            box-shadow: 0 8px 16px rgba(1, 31, 69, 0.16);
        }

        /* Mobile-only wrapper: hidden by default (desktop) */
        .mobile-controls {
            display: none;
        }

        /* Reveal mobile controls on small screens */
        @media (max-width: 768px) {
            .mobile-controls {
                display: grid;
                justify-items: center;
                gap: 14px;
                margin-top: 20px;
            }
        }

        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 72px);
            grid-template-rows: repeat(3, 72px);
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .dpad-grid div {
            width: 72px;
            height: 72px;
        }

        .control-btn {
            width: 72px;
            height: 72px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(145deg, #1395d5, #0572a6);
            color: white;
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 14px 28px rgba(0, 29, 62, 0.24);
            touch-action: none;
            user-select: none;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }

        .control-btn:hover {
            background: linear-gradient(145deg, #0f7daa, #045b80);
        }

        .control-btn:active {
            transform: scale(0.94);
            background: linear-gradient(145deg, #096189, #044b6c);
            box-shadow: 0 10px 18px rgba(0, 29, 62, 0.2);
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #2e3f55;
        }

        .instructions.mobile {
            margin-top: 8px;
            font-size: 13px;
            color: #23405f;
        }
        
        /* Landscape phone layout: side-by-side canvas + sidebar */
        @media (orientation: landscape) and (max-height: 520px) {
            .game-container {
                display: flex;
                flex-direction: row;
                align-items: flex-start;
                gap: 12px;
                padding: 12px;
            }

            /* Canvas column */
            canvas {
                flex: 1 1 auto;
                width: auto;
                max-height: 80vh;
                border-radius: 12px;
            }

            /* Sidebar column */
            .sidebar {
                width: 260px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: stretch;
                justify-content: flex-start;
            }

            /* Hide the main header to save vertical space */
            h1 {
                display: none;
            }

            /* Compact score and missed boxes */
            .game-info {
                flex-direction: column;
                gap: 6px;
                padding: 8px;
                font-size: 15px;
                border-radius: 14px;
            }

            .score, .missed {
                padding: 8px 10px;
                font-size: 16px;
                margin: 0;
            }

            /* Make utility buttons compact */
            .music-btn {
                min-width: 96px;
                padding: 8px 10px;
                font-size: 13px;
            }

            /* D-pad on the right and slightly smaller */
            .mobile-controls {
                align-self: center;
                margin-top: 6px;
            }

            .dpad-grid {
                grid-template-columns: repeat(3, 56px);
                grid-template-rows: repeat(3, 56px);
                gap: 8px;
            }

            .control-btn {
                width: 56px;
                height: 56px;
                border-radius: 12px;
                font-size: 20px;
            }
        }

        h1 {
            color: #2E8B57;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🦈 Monster Shark Catch Fish 🐟</h1>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="sidebar">
        <div class="game-info">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="missed">Missed: <span id="missed">0</span></div>
        </div>
        <div class="instructions">
            Use arrow keys to move the shark. Catch fish to score points!
        </div>
        <div class="music-controls" id="musicControls">
            <button id="toggleMusic" class="music-btn">Play Music</button>
            <button id="stopMusic" class="music-btn">Stop Music</button>
            <button id="pauseGame" class="music-btn">Pause Game</button>
        </div>
        <div class="controls-container mobile-controls" id="mobileControls">
            <div class="dpad-grid">
                <div></div>
                <button class="control-btn" data-dir="up">↑</button>
                <div></div>
                <button class="control-btn" data-dir="left">←</button>
                <div></div>
                <button class="control-btn" data-dir="right">→</button>
                <div></div>
                <button class="control-btn" data-dir="down">↓</button>
            </div>
            <div class="instructions mobile">
                Touch controls for mobile — hold buttons to move, release to stop.
            </div>
        </div>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        Game Over! Press R to Restart
    </div>
    
    <script src="game.js"></script>
</body>
</html>
