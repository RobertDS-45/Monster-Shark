<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Shark Catch Fish</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #87CEEB, #98FB98);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: min(100vw - 20px, 760px);
            max-width: 760px;
        }
        
        canvas {
            border: 3px solid #333;
            border-radius: 10px;
            background: linear-gradient(to bottom, #87CEEB, #98FB98);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 3 / 2;
            display: block;
            margin: 0 auto;
        }
        
        @media (max-width: 640px) {
            .game-container {
                padding: 16px;
            }
            .game-info {
                flex-direction: column;
                gap: 10px;
                font-size: 16px;
            }
            .control-btn {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
            .instructions,
            .instructions.mobile {
                font-size: 14px;
            }
            .music-btn {
                min-width: 90px;
                font-size: 13px;
                padding: 8px 12px;
            }
        }
        
        .game-info {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
        }
        
        .score {
            color: #2E8B57;
        }
        
        .missed {
            color: #DC143C;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 20, 60, 0.9);
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .controls-container {
            display: none;
            margin-top: 15px;
            text-align: center;
            gap: 8px;
        }

        .music-controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .music-btn {
            min-width: 100px;
            padding: 10px 14px;
            border: none;
            border-radius: 14px;
            background: rgba(30, 144, 255, 0.95);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .music-btn:hover {
            background: rgba(24, 116, 205, 0.95);
        }

        .music-btn:active {
            transform: scale(0.98);
        }

        .control-row {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 16px;
            background: rgba(46, 139, 87, 0.95);
            color: white;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            touch-action: none;
            user-select: none;
        }

        .control-btn:active {
            transform: scale(0.98);
            background: rgba(34, 139, 34, 0.95);
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .instructions.mobile {
            margin-top: 8px;
            font-size: 13px;
            color: #444;
        }
        
        h1 {
            color: #2E8B57;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🦈 Monster Shark Catch Fish 🐟</h1>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="game-info">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="missed">Missed: <span id="missed">0</span>/100</div>
        </div>
        <div class="instructions">
            Use arrow keys to move the shark. Catch fish to score points!
        </div>
        <div class="music-controls" id="musicControls">
            <button id="toggleMusic" class="music-btn">Play Music</button>
            <button id="stopMusic" class="music-btn">Stop Music</button>
            <button id="pauseGame" class="music-btn">Pause Game</button>
        </div>
        <div class="controls-container" id="mobileControls">
            <div class="control-row">
                <button class="control-btn" data-dir="up">↑</button>
            </div>
            <div class="control-row">
                <button class="control-btn" data-dir="left">←</button>
                <button class="control-btn" data-dir="down">↓</button>
                <button class="control-btn" data-dir="right">→</button>
            </div>
            <div class="instructions mobile">
                Touch controls for mobile — hold buttons to move, release to stop.
            </div>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        Game Over! Press R to Restart
    </div>
    
    <script src="game.js"></script>
</body>
</html>
