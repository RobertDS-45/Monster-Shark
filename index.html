<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Shark Catch Fish</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #072a50 0%, #021428 60%, #001222 100%);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100svh;
            padding: 12px;
            box-shadow: 0 22px 60px rgba(5, 24, 58, 0.28);
            width: 100%;
        }
        
        .scene-wrapper {
            position: relative;
            width: 100%;
            max-width: 920px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(2, 18, 34, 0.5);
        }

        .reef-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }

        canvas {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: min(62vh, 72vw);
            max-height: 74vh;
            background: transparent;
        }
        
        @media (max-width: 768px) {
            /* Compact the main card and reduce spacing so everything fits vertically */
            .game-container {
                padding: 10px;
                width: calc(100vw - 12px);
            }

            h1 {
                font-size: 18px;
                margin: 6px 0 8px 0;
            }

            /* Canvas should prefer height but be capped so controls remain visible */
            canvas {
                max-height: 38vh;
                height: auto;
            }

            /* Score boxes — compact and stacked */
            .game-info {
                flex-direction: column;
                gap: 6px;
                font-size: 15px;
                padding: 6px;
                margin-top: 8px;
            }

            .score, .missed {
                padding: 8px 10px;
                font-size: 15px;
            }

            .instructions {
                margin-top: 6px;
                margin-bottom: 6px;
                font-size: 13px;
            }

            /* Utility buttons: flex container for rows */
            .music-controls {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                order: 1;
                margin-top: 6px;
            }

            /* Audio controls row: Play + Stop side-by-side */
            .audio-controls-row {
                display: flex;
                justify-content: center;
                gap: 10px;
                width: 100%;
            }

            /* Centered pause/resume button beneath the audio row */
            .game-control-row {
                display: flex;
                justify-content: center;
                margin-top: 2px;
            }

            .music-btn {
                min-width: 0;
                padding: 8px 10px;
                font-size: 13px;
                border-radius: 12px;
            }

            /* Slightly different sizing for the pause/resume button */
            .game-control-btn {
                min-width: 120px;
                padding: 8px 12px;
            }

            /* For very narrow devices, use a compact 2-column grid for audio buttons */
            @media (max-width: 420px) {
                .audio-controls-row {
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 6px;
                }

                .game-control-btn {
                    min-width: auto;
                    width: 100%;
                }
            }

            /* D-pad should sit directly under the utility buttons and be slightly smaller */
            .mobile-controls {
                order: 2;
                margin-top: 6px;
                align-self: center;
            }

            .dpad-grid {
                grid-template-columns: repeat(3, 56px);
                grid-template-rows: repeat(3, 56px);
                gap: 6px;
            }

            .control-btn {
                width: 56px;
                height: 56px;
                font-size: 20px;
                border-radius: 12px;
            }
        }
        
        .info-row {
            margin-top: 14px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .info-box {
            flex: 1 1 48%;
            padding: 12px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.92);
            color: #07324c;
            font-weight: 800;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
            border: 1px solid rgba(7, 41, 81, 0.08);
            text-align: left;
        }
        
        .game-over {
            position: absolute;
            inset: 20px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5;
            background: rgba(0, 23, 55, 0.72);
            color: #f8f2e9;
            padding: 30px 24px;
            border-radius: 28px;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            box-shadow: 0 24px 48px rgba(3, 20, 50, 0.38);
        }

        #musicControls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        .game-control-row { text-align: center; margin-top: 12px }

        .game-control-btn {
            background: linear-gradient(180deg,#39a0ff,#0a6fb8);
            color: white;
            padding: 12px 26px;
            border-radius: 28px;
            border: none;
            font-weight: 800;
            box-shadow: 0 12px 24px rgba(3,20,50,0.28);
            cursor: pointer;
            min-width: 160px;
        }

        .game-control-btn:active { transform: scale(0.98) }


        /* Compact D-pad positioned bottom-right for one-handed operation */
        .mobile-controls { display: none }

        .dpad-compact { position: fixed; right: 14px; bottom: 18px; z-index: 40; display:flex; flex-direction:column; gap:6px; align-items:center }
        .dpad-middle { display:flex; gap:6px; align-items:center }
        .dpad-btn { width:46px; height:46px; border-radius:10px; border:none; background:linear-gradient(145deg,#0ea5d7,#0b7fa6); color:white; font-weight:800; font-size:18px; box-shadow:0 8px 16px rgba(0,20,40,0.32) }
        .dpad-btn.small { width:42px; height:42px; font-size:16px }

        @media (max-width: 768px) {
            .mobile-controls { display: block }
            .scene-wrapper { border-radius: 14px }
            canvas { height: 54vh; max-height: 64vh }
            .title { font-size: 18px }
            .info-box { padding: 10px 12px; font-size: 15px }
            .game-control-btn { min-width: 140px }
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #2e3f55;
        }

        .instructions.mobile {
            margin-top: 8px;
            font-size: 13px;
            color: #23405f;
        }
        
        /* Landscape phone layout: side-by-side canvas + sidebar */
        @media (orientation: landscape) and (max-height: 520px) {
            .game-container {
                display: flex;
                flex-direction: row;
                align-items: flex-start;
                gap: 12px;
                padding: 12px;
            }

            /* Canvas column */
            canvas {
                flex: 1 1 auto;
                width: auto;
                max-height: 80vh;
                border-radius: 12px;
            }

            /* Sidebar column */
            .sidebar {
                width: 260px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: stretch;
                justify-content: flex-start;
            }

            /* Hide the main header to save vertical space */
            h1 {
                display: none;
            }

            /* Compact score and missed boxes */
            .game-info {
                flex-direction: column;
                gap: 6px;
                padding: 8px;
                font-size: 15px;
                border-radius: 14px;
            }

            .score, .missed {
                padding: 8px 10px;
                font-size: 16px;
                margin: 0;
            }

            /* Make utility buttons compact */
            .music-btn {
                min-width: 96px;
                padding: 8px 10px;
                font-size: 13px;
            }

            /* D-pad on the right and slightly smaller */
            .mobile-controls {
                align-self: center;
                margin-top: 6px;
            }

            .dpad-grid {
                grid-template-columns: repeat(3, 56px);
                grid-template-rows: repeat(3, 56px);
                gap: 8px;
            }

            .control-btn {
                width: 56px;
                height: 56px;
                border-radius: 12px;
                font-size: 20px;
            }
        }

        h1 {
            color: #2E8B57;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .page-header { display:flex; gap:8px; align-items:center; justify-content:center; width:100%; margin:6px 0 10px 0 }
        .page-header .title { font-weight:900; color:#7fe0ff; font-size:20px; text-shadow:0 3px 6px rgba(0,0,0,0.3) }
        .page-header .shark-icon { font-size:20px }
        .page-header .fish-icon { font-size:18px }
        .instructions { margin-top: 10px; font-size: 13px; color: #cfe8f6; text-align:center }
    </style>
</head>
<body>
    <div class="game-container">
        <header class="page-header">
            <span class="shark-icon">🦈</span>
            <div class="title">Monster Shark Catch Fish</div>
            <span class="fish-icon">🐟</span>
        </header>

        <div class="scene-wrapper">
            <!-- Dense SVG reef background to simulate coral, many small fish and sunbeams -->
            <svg class="reef-bg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                    <radialGradient id="sun" cx="50%" cy="10%" r="60%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
                        <stop offset="40%" stop-color="#a6e6ff" stop-opacity="0.12" />
                        <stop offset="100%" stop-color="#0a2b45" stop-opacity="0.0" />
                    </radialGradient>
                    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.12"/>
                        <stop offset="60%" stop-color="#0b2540" stop-opacity="0.9"/>
                    </linearGradient>
                </defs>

                <rect width="100%" height="100%" fill="url(#water)" />
                <ellipse cx="600" cy="-80" rx="600" ry="220" fill="url(#sun)" />

                <!-- repeated small fish clusters (many elements to create density) -->
                <g fill="none" stroke="#ffd37a" stroke-width="2" transform="translate(0,0)">
                    <g transform="translate(80,120) scale(0.9)">
                        <path d="M0,0 q10,7 24,0 q-14,7 -24,0" fill="#ffd37a" />
                    </g>
                </g>

                <!-- several colorful fish scattered -->
                <g id="fishSet">
                    <g transform="translate(140,90) scale(1)"><path d="M0,0 q18,-10 36,0 q-12,8 -36,0" fill="#ff6b6b" /></g>
                    <g transform="translate(240,210) scale(0.9)"><path d="M0,0 q16,-8 32,0 q-10,6 -32,0" fill="#ffd166" /></g>
                    <g transform="translate(360,70) scale(1.1)"><path d="M0,0 q20,-12 40,0 q-14,10 -40,0" fill="#66d9ef" /></g>
                    <g transform="translate(480,180) scale(0.8)"><path d="M0,0 q12,-6 24,0 q-8,5 -24,0" fill="#9b8cff" /></g>
                    <g transform="translate(580,40) scale(1.2)"><path d="M0,0 q24,-14 48,0 q-18,12 -48,0" fill="#7efc6e" /></g>
                    <g transform="translate(720,140) scale(0.85)"><path d="M0,0 q14,-8 28,0 q-10,6 -28,0" fill="#ffd1f2" /></g>
                    <g transform="translate(860,90) scale(1)"><path d="M0,0 q18,-10 36,0 q-12,8 -36,0" fill="#ffd166" /></g>
                    <g transform="translate(940,220) scale(0.9)"><path d="M0,0 q16,-8 32,0 q-10,6 -32,0" fill="#89cff0" /></g>
                    <g transform="translate(200,320) scale(1)"><path d="M0,0 q20,-12 40,0 q-14,10 -40,0" fill="#ff9f1c" /></g>
                    <g transform="translate(420,320) scale(0.7)"><path d="M0,0 q12,-6 24,0 q-8,5 -24,0" fill="#ff6b6b" /></g>
                    <g transform="translate(680,300) scale(1.05)"><path d="M0,0 q22,-12 44,0 q-16,10 -44,0" fill="#3ddc97" /></g>
                </g>

                <!-- coral clusters as colored blobs -->
                <g id="corals" transform="translate(60,520)">
                    <g transform="translate(0,0)">
                        <ellipse cx="40" cy="24" rx="40" ry="24" fill="#f15bb5" />
                        <ellipse cx="18" cy="10" rx="18" ry="10" fill="#f08a5d" />
                        <ellipse cx="70" cy="8" rx="16" ry="8" fill="#ffb238" />
                    </g>
                    <g transform="translate(180,20) scale(1.1)">
                        <ellipse cx="40" cy="24" rx="46" ry="26" fill="#f6d365" />
                        <ellipse cx="20" cy="10" rx="22" ry="12" fill="#ff7b54" />
                    </g>
                    <g transform="translate(340,6) scale(1.2)">
                        <ellipse cx="40" cy="24" rx="54" ry="28" fill="#9b5de5" />
                        <ellipse cx="10" cy="8" rx="14" ry="8" fill="#00bbf9" />
                    </g>
                    <g transform="translate(520,18) scale(1)">
                        <ellipse cx="40" cy="24" rx="48" ry="26" fill="#00f5d4" />
                    </g>
                    <g transform="translate(760,0) scale(1.05)">
                        <ellipse cx="36" cy="22" rx="42" ry="24" fill="#ffb3c1" />
                    </g>
                    <g transform="translate(920,24) scale(0.95)">
                        <ellipse cx="40" cy="24" rx="46" ry="26" fill="#ffd6a5" />
                    </g>
                </g>

                <!-- big shark silhouette to the right / center -->
                <g transform="translate(760,80) scale(1.6)" fill="#08375f" opacity="0.98">
                    <path d="M0,40 q80,-40 180,-10 q-40,-30 20,-50 q-30,50 20,90 q-80,30 -200,-30 z" />
                </g>
            </svg>

            <!-- canvas stays on top for game rendering; transparent background so reef shows through -->
            <canvas id="gameCanvas" width="900" height="600"></canvas>
        </div>

        <div class="info-row">
            <div class="info-box score">Score: <span id="score">0</span></div>
            <div class="info-box missed">Missed: <span id="missed">28 / 100</span></div>
        </div>

        <div class="game-control-row">
            <button id="pauseGame" class="game-control-btn">Pause Game</button>
        </div>

        <div class="instructions">
            Use arrow keys to move the shark. Catch fish to score points!
        </div>

        <div class="controls-container mobile-controls" id="mobileControls">
            <div class="dpad-compact" aria-hidden="false">
                <button class="dpad-btn" data-dir="up">↑</button>
                <div class="dpad-middle">
                    <button class="dpad-btn" data-dir="left">←</button>
                    <button class="dpad-btn small" data-dir="down">↓</button>
                    <button class="dpad-btn" data-dir="right">→</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        Game Over! Press R to Restart
    </div>
    
    <script src="game.js"></script>
</body>
</html>
